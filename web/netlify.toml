# Set the Netlify site's base directory to `web`.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Shared links: each kind has its own page with link-preview tags (vite.config.ts sharePages).
# Listed before the SPA fallback so X and Telegram get those tags, not the home page's.
[[redirects]]
  from = "/s/turned"
  to = "/s/turned/index.html"
  status = 200

[[redirects]]
  from = "/s/held"
  to = "/s/held/index.html"
  status = 200

[[redirects]]
  from = "/s/practice-turned"
  to = "/s/practice-turned/index.html"
  status = 200

[[redirects]]
  from = "/s/practice-held"
  to = "/s/practice-held/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
